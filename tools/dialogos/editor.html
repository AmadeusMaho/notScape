<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editor de diálogos</title>
<style>
:root{--bg:#14110d;--pn:#1d1812;--pn2:#262017;--ln:rgba(232,207,148,.28);--gd:#e8cf94;--tx:#e9e0cc;--mu:#a89d86;--ok:#9bd04f;--er:#e0604a}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.45 Georgia,"Spectral",serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--ln);background:var(--pn)}
header h1{margin:0;font:600 17px/1 "Cinzel",Georgia,serif;letter-spacing:.12em;color:var(--gd)}
#st{margin-left:auto;font-size:13px;color:var(--mu)}#st.ok{color:var(--ok)}#st.er{color:var(--er)}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--pn2);border:1px solid var(--ln);border-radius:6px;padding:5px 11px;cursor:pointer}button:hover{border-color:var(--gd);background:#2f281d}
button.pri{border-color:var(--gd);color:var(--gd)}button.dg:hover{border-color:var(--er);color:var(--er)}
main{flex:1;display:flex;min-height:0}
aside{width:310px;border-right:1px solid var(--ln);display:flex;flex-direction:column;background:var(--pn)}
aside .tools{padding:10px;display:flex;gap:8px;flex-direction:column;border-bottom:1px solid var(--ln)}
aside input,aside select{width:100%;padding:6px 8px;background:#100d09;border:1px solid var(--ln);border-radius:6px}
#list{overflow:auto;flex:1}
.grp{padding:8px 12px 4px;font:600 11px "Cinzel",serif;letter-spacing:.14em;color:var(--gd);text-transform:uppercase}
.it{padding:6px 12px;cursor:pointer;border-left:3px solid transparent;display:flex;gap:8px;align-items:baseline}.it:hover{background:#241e15}
.it.on{background:#2b2418;border-left-color:var(--gd)}.it small{color:var(--mu)}.it .dot{margin-left:auto;color:var(--gd)}
section{flex:1;overflow:auto;padding:18px 26px 60px}
section h2{margin:0 0 2px;font:600 20px "Cinzel",serif;color:var(--gd)}section .sub{color:var(--mu);margin-bottom:14px;font-size:13px}
h3{margin:22px 0 8px;font:600 13px "Cinzel",serif;letter-spacing:.12em;color:var(--gd);text-transform:uppercase}
.card{border:1px solid var(--ln);border-radius:9px;background:var(--pn);padding:10px 12px;margin-bottom:10px}
.card .hd{display:flex;gap:8px;align-items:center;margin-bottom:6px;color:var(--mu);font-size:12px}.card .hd b{color:var(--gd);font-weight:600}.card .hd .sp{margin-left:auto;display:flex;gap:6px}
.pg{margin:6px 0;display:flex;gap:6px;align-items:flex-start}.pg>span{flex:0 0 22px;color:var(--mu);font-size:12px;padding-top:7px;text-align:right}
.pg textarea{flex:1;min-height:44px;resize:vertical;background:#100d09;border:1px solid var(--ln);border-radius:6px;padding:6px 8px;line-height:1.4}
.pg textarea:focus{outline:none;border-color:var(--gd)}
.ro{background:#100d09;border:1px dashed var(--ln);border-radius:6px;padding:6px 8px;margin:4px 0;color:#cfc6b0;white-space:pre-wrap}
.hint{color:var(--mu);font-size:12.5px;margin:4px 0 10px}
.fld{margin-bottom:12px}.fld label{display:flex;gap:8px;align-items:center;margin-bottom:3px;color:var(--gd);font-size:12.5px}.fld label button{margin-left:auto;font-size:12px;padding:2px 8px}
.fld textarea{width:100%;min-height:58px;resize:vertical;background:#100d09;border:1px solid var(--ln);border-radius:6px;padding:6px 8px}.fld textarea.ch{border-color:var(--gd)}
#load{padding:30px;color:var(--mu)}
.empty{color:var(--mu);padding:18px 0}
</style>
</head>
<body>
<header>
  <h1>EDITOR DE DIÁLOGOS</h1>
  <button id="reload" title="Vuelve a leer los textos originales del juego">Recargar originales</button>
  <a href="/index.html" target="_blank"><button>Abrir el juego</button></a>
  <div id="st">Cargando…</div>
</header>
<main>
  <aside>
    <div class="tools">
      <input id="q" placeholder="Buscar por nombre, rol o texto…">
      <select id="f"><option value="all">Todos</option><option value="chg">Solo con cambios</option></select>
    </div>
    <div id="list"></div>
  </aside>
  <section id="det"><div id="load">Leyendo los diálogos del juego… (puede tardar unos segundos la primera vez)</div></section>
</main>
<iframe id="gm" style="position:absolute;left:-9999px;width:900px;height:560px;border:0" tabindex="-1"></iframe>
<script>
'use strict';
const $=s=>document.querySelector(s),el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.textContent=h;return e};
const QF=[['name','Nombre de la misión'],['hi','Saludo (antes de ofrecer la misión)'],['desc','Descripción (panel de misión)'],['rem','Recordatorio (misión aceptada)'],['turn','Al volver a entregarla'],['done','Al completarla (agradecimiento)']];
let DATA={npcs:{},quests:{}},DEF={npcs:[],quests:[]},sel=null,tSave=0,saving=0,dirty=0;
const status=(t,c)=>{const s=$('#st');s.textContent=t;s.className=c||''};
// ───── guardado (automático) ─────
function clean(){const o={npcs:{},quests:{}};for(const [k,v] of Object.entries(DATA.npcs)){const conv=(v.conv||[]).map(c=>c.filter(p=>p.trim())).filter(c=>c.length);if(conv.length)o.npcs[k]={conv}}
  for(const [k,v] of Object.entries(DATA.quests)){const d={};QF.forEach(([f])=>{if(v[f]&&v[f].trim())d[f]=v[f]});if(Object.keys(d).length)o.quests[k]=d}return o}
function touch(){dirty=1;status('Cambios sin guardar…');clearTimeout(tSave);tSave=setTimeout(save,700);renderList(true)}
async function save(){if(saving){tSave=setTimeout(save,300);return}saving=1;status('Guardando…');
  try{const r=await fetch('/api/dialogos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(clean())}),j=await r.json();
    if(!r.ok||j.error)throw new Error(j.error||r.status);dirty=0;status('Guardado ✓ '+j.at+' · '+j.npcs+' PNJ y '+j.quests+' misiones con cambios','ok')}
  catch(e){status('ERROR al guardar: '+e.message+' (¿abriste el editor desde tools/dialogos/server.py?)','er')}saving=0}
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
// ───── lista ─────
const has=id=>!!(DATA.npcs[id]&&DATA.npcs[id].conv&&DATA.npcs[id].conv.some(c=>c.some(p=>p.trim())));
const hasQ=id=>!!(DATA.quests[id]&&QF.some(([f])=>DATA.quests[id][f]&&DATA.quests[id][f].trim()));
function renderList(keep){const q=$('#q').value.toLowerCase().trim(),f=$('#f').value,L=$('#list'),top=L.scrollTop;L.innerHTML='';
  const hay=(n)=>(n.nm+' '+n.rol+' '+n.id+' '+n.src+' '+n.variants.map(v=>v.join(' ')).join(' ')).toLowerCase();
  const groups=new Map();
  if(DEF.quests.length){const qs=DEF.quests.filter(x=>(!q||(x.name+' '+x.hi+' '+x.desc+' '+x.done).toLowerCase().includes(q))&&(f!=='chg'||hasQ(x.npc)));if(qs.length)groups.set('Misiones del tutorial (Cielo)',qs.map(x=>({t:'q',id:x.npc,nm:x.name,rol:'misión',chg:hasQ(x.npc)})))}
  DEF.npcs.forEach(n=>{if(q&&!hay(n).includes(q))return;if(f==='chg'&&!has(n.id))return;if(!groups.has(n.src))groups.set(n.src,[]);groups.get(n.src).push({t:'n',id:n.id,nm:n.nm,rol:n.rol,chg:has(n.id)})});
  for(const [g,arr] of groups){L.append(el('div','grp',g));arr.forEach(x=>{const d=el('div','it'+(sel&&sel.t===x.t&&sel.id===x.id?' on':''));d.append(el('span','',x.nm));d.append(el('small','',x.rol));if(x.chg)d.append(el('span','dot','●'));d.onclick=()=>{sel={t:x.t,id:x.id};renderList(true);renderDet()};L.append(d)})}
  if(!groups.size)L.append(el('div','empty','Nada que mostrar.'));if(keep)L.scrollTop=top}
// ───── detalle ─────
function ta(val,onin,ph){const t=el('textarea');t.value=val||'';if(ph)t.placeholder=ph;t.oninput=()=>{onin(t.value);auto(t)};setTimeout(()=>auto(t),0);return t}
function auto(t){t.style.height='auto';t.style.height=Math.max(44,t.scrollHeight+2)+'px'}
function renderDet(){const D=$('#det');D.innerHTML='';if(!sel){D.append(el('div','empty','Elige un PNJ o una misión de la izquierda.'));return}
  if(sel.t==='q')return renderQuest(D);const n=DEF.npcs.find(x=>x.id===sel.id);if(!n){D.append(el('div','empty','No encontrado.'));return}
  D.append(el('h2','',n.nm+' · '+n.rol));D.append(el('div','sub',n.src+' · id: '+n.id));
  const mine=DATA.npcs[n.id]=DATA.npcs[n.id]||{conv:[]};
  D.append(el('h3','','Tus diálogos'));
  D.append(el('div','hint','Si hay al menos una conversación con texto, el juego USA SOLO las tuyas para este PNJ (rotan: 1.ª vez la 1.ª, 2.ª vez la 2.ª…). Cada recuadro es una página: se ve completa y se pulsa para pasar a la siguiente. Sin conversaciones, el juego usa los originales.'));
  mine.conv.forEach((c,ci)=>{const card=el('div','card'),hd=el('div','hd');hd.append(el('b','','Conversación '+(ci+1)));const sp=el('div','sp');
    const dup=el('button','','Duplicar');dup.onclick=()=>{mine.conv.splice(ci+1,0,c.slice());touch();renderDet()};
    const del=el('button','dg','Borrar conversación');del.onclick=()=>{if(confirm('¿Borrar la conversación '+(ci+1)+'?')){mine.conv.splice(ci,1);touch();renderDet()}};sp.append(dup,del);hd.append(sp);card.append(hd);
    c.forEach((p,pi)=>{const r=el('div','pg');r.append(el('span','',pi+1));r.append(ta(p,v=>{c[pi]=v;touch()},'Texto de la página…'));const x=el('button','dg','✕');x.title='Quitar página';x.onclick=()=>{c.splice(pi,1);touch();renderDet()};r.append(x);card.append(r)});
    const add=el('button','','+ Página');add.onclick=()=>{c.push('');renderDet()};card.append(add);D.append(card)});
  const bar=el('div','');bar.style.cssText='display:flex;gap:8px;flex-wrap:wrap';
  const nw=el('button','pri','+ Conversación nueva');nw.onclick=()=>{mine.conv.push(['']);renderDet()};bar.append(nw);
  if(mine.conv.length){const rs=el('button','dg','Restaurar los originales del juego');rs.onclick=()=>{if(confirm('Se borran TODAS tus conversaciones de este PNJ y vuelve a usar las originales. ¿Seguro?')){mine.conv=[];touch();renderDet()}};bar.append(rs)}
  D.append(bar);
  D.append(el('h3','','Originales del juego (referencia, no se editan)'));
  if(!n.variants.length)D.append(el('div','empty','Este PNJ no tiene texto detectable.'));
  n.variants.forEach((v,vi)=>{const card=el('div','card'),hd=el('div','hd');hd.append(el('b','','Variante '+(vi+1)));const sp=el('div','sp'),cp=el('button','','Copiar como conversación mía');cp.onclick=()=>{mine.conv.push(v.slice());touch();renderDet()};sp.append(cp);hd.append(sp);card.append(hd);v.forEach((p,pi)=>{const r=el('div','ro');r.textContent=(v.length>1?'['+(pi+1)+'] ':'')+p;card.append(r)});D.append(card)});
  D.append(el('div','hint','Los originales rotan por veces, día/noche y nivel; aquí se muestran las variantes que el juego puede decir (probado con nivel 10).'))}
function renderQuest(D){const q=DEF.quests.find(x=>x.npc===sel.id);if(!q)return;D.append(el('h2','',q.name));D.append(el('div','sub','Misión del tutorial de la isla del Cielo · PNJ: '+q.npc));
  D.append(el('div','hint','Deja un campo vacío para usar el texto original (se ve en gris como ejemplo). Los cambios se aplican al recargar el juego.'));
  const mine=DATA.quests[q.npc]=DATA.quests[q.npc]||{};
  QF.forEach(([f,lab])=>{const w=el('div','fld'),l=el('label','',lab),b=el('button','','Restaurar');w.append(l);
    const t=ta(mine[f]||'',v=>{mine[f]=v;t.classList.toggle('ch',!!v.trim());touch()},q[f]);t.classList.toggle('ch',!!(mine[f]||'').trim());
    b.onclick=()=>{mine[f]='';t.value='';t.classList.remove('ch');touch();auto(t)};l.append(b);w.append(t);D.append(w)})}
// ───── carga de originales desde el propio juego (iframe) ─────
function loadDefaults(){const f=$('#gm');$('#det').innerHTML='<div id="load">Leyendo los diálogos del juego… (puede tardar unos segundos)</div>';f.src='/index.html?test=1&noedit&no3d=1&nodlg&t='+Date.now();let tries=0;
  const poll=()=>{tries++;try{const w=f.contentWindow;/* DLG, VILL, ISLA son `const` globales del juego: no cuelgan de window, se leen con eval dentro del iframe */if(w&&w.eval('typeof DLG!=="undefined"&&typeof VILL!=="undefined"&&VILL.LIST.length>12&&typeof ISLA!=="undefined"&&ISLA.QUESTS.length>0')){DEF=w.eval('DLG.dump()');status('Originales cargados: '+DEF.npcs.length+' PNJ','ok');renderList();renderDet();return}}catch(e){}
    if(tries>240){status('No pude leer los diálogos del juego (¿falla el juego? abre /index.html y mira la consola)','er');return}setTimeout(poll,500)};setTimeout(poll,1500)}
async function init(){try{const r=await fetch('/api/dialogos');const j=await r.json();DATA={npcs:j.npcs||{},quests:j.quests||{}}}catch(e){status('No encuentro el servidor del editor: arranca  python tools/dialogos/server.py','er')}
  loadDefaults()}
$('#q').oninput=()=>renderList();$('#f').onchange=()=>renderList();$('#reload').onclick=loadDefaults;init();
</script>
</body>
</html>
