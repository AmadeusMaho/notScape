<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NotScape</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Pixelify+Sans:wght@700&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/hud-susurro.css"></head><body>
<div id="boot" role="status" aria-live="polite"><div id="bt-box"><div id="bt-logo">NotScape</div><div id="bt-bar"><i id="bt-fill"></i></div><div id="bt-msg">Preparando el mundo…</div></div></div>
<div id="cw"><canvas id="c" width="640" height="400"></canvas><div id="dlg" onclick="dlgNext()"></div></div>
<div id="hud">
<div id="topl"><div id="hd"></div><div class="panel" id="goalp"><h2 onclick="tgGoal()" title="Mostrar / ocultar">Objetivo</h2><div id="goals"></div></div></div>
<div id="botl"><div id="log"></div><div id="ctl"><span class="ctl-sep ctl-first">Sonido</span><button class="bt" id="mutb" onclick="mut()">🔊 Sonido: SÍ</button><label class="sl" title="Volumen de la música">🎵 <input type="range" id="mv" min="0" max="100"></label><label class="sl" title="Volumen de los efectos">🔊 <input type="range" id="sv" min="0" max="100"></label><span class="ctl-sep">Juego</span><button class="bt" id="runb" onclick="tgRun()">🏃 Correr: NO (R)</button><button class="bt" id="autob" onclick="tgAuto()" title="Al matar un enemigo, ir solo al siguiente. Con enemigos agresivos solo lo hace si no arrastra a otros.">🎯 Auto-objetivo: SÍ</button><button class="bt" id="arb" onclick="arTog()"></button><button class="bt" id="curb" onclick="tgCur()" title="Muestra un rombo en el tile bajo el puntero (tecla G)">▱ Cursor: NO (G)</button><span class="ctl-sep">Gráficos</span><button class="bt" id="qb" onclick="tgQ()" title="Resolución del dibujo. Auto baja sola si el juego va lento">🖼 Calidad</button><button class="bt" id="sgb" hidden title="Sangre en los golpes y manchas en el suelo (solo 3D). Cicla Normal → NO → Poca. También: ?sangre=0|1|2 en la URL.">🩸 Sangre</button><label class="sl" id="ovl" hidden title="Intensidad del estilo «óleo oscuro» (solo 3D). 0 = colores originales, 100 = look No Rest for the Wicked. Bájalo si algo no se lee bien.">🎨 Óleo <input type="range" id="ov" min="0" max="100"></label><label class="sl" id="gf-tilt-l" hidden title="Desenfoque de arriba y abajo de la pantalla (efecto diorama). Solo actúa en calidad Máxima/Alta y se apaga al alejar el zoom. 0 = nítido.">🔭 Inclinación <input type="range" id="gf-tilt" min="0" max="100"></label><label class="sl" id="gf-cloud-l" hidden title="Sombras de nubes que cruzan el suelo de día. 0 = sin sombras.">☁ Nubes <input type="range" id="gf-cloud" min="0" max="100"></label><label class="sl" id="gf-wind-l" hidden title="Vaivén del pasto y de las copas. 0 = quieto.">🍃 Viento <input type="range" id="gf-wind" min="0" max="100"></label><button class="bt" id="gf-reset" hidden title="Vuelve inclinación, nubes y viento a sus valores por defecto">↺ Restablecer gráficos</button><span class="ctl-sep">Partida</span><button class="bt" onclick="exportSave()">💾 Guardar en archivo</button><button class="bt" onclick="importSave()">📂 Cargar archivo</button><button class="bt danger" id="rstb" onclick="resetGame()">Reiniciar</button></div></div>
<div id="side" class="closed"><div id="pw"><div id="pn"></div></div>
<div id="tabs"><button class="bt" data-t="inv" title="Inventario (I)" onclick="tabClick('inv')"><i class="ic" data-ic="bag"></i><span class="lb">Inv</span></button><button class="bt" data-t="ch" title="Personaje (P)" onclick="tabClick('ch')"><i class="ic" data-ic="person"></i><span class="lb">Personaje</span></button><button class="bt" data-t="sk" title="Skills (K)" onclick="tabClick('sk')"><i class="ic" data-ic="chart"></i><span class="lb">Skills</span></button><button class="bt" data-t="qm" title="Misiones (Q)" onclick="tabClick('qm')"><i class="ic" data-ic="scroll"></i><span class="lb">Misiones</span></button><button class="bt" data-t="q" title="Logros (L)" onclick="tabClick('q')"><i class="ic" data-ic="trophy"></i><span class="lb">Logros</span></button><button class="bt" data-t="col" title="Colección (C)" onclick="tabClick('col')"><i class="ic" data-ic="book"></i><span class="lb">Colección</span></button><button class="bt" data-t="pr" title="Oraciones (O)" onclick="tabClick('pr')"><i class="ic" data-ic="pray"></i><span class="lb">Oración</span></button><button class="bt" data-t="mg" title="Magia (Z)" onclick="tabClick('mg')"><i class="ic" data-ic="star"></i><span class="lb">Magia</span></button><button class="bt" id="gear" title="Opciones: partida (guardar/cargar), correr, auto-objetivo, cursor, volumen, calidad" onclick="document.body.classList.toggle('ctl')"><i class="ic" data-ic="gear"></i></button></div></div>
</div>
<button id="specb" onclick="specTog()" hidden></button>
<div id="fp" hidden onclick="useNear()"></div>
<div id="sw" hidden><div id="swh"><i id="swi"></i><b id="swt"></b><button class="bt x" title="Cerrar (F / Esc)" onclick="closeIW()">✕</button></div><div id="swf"></div><div id="swb"></div></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="wob" x="-4%" y="-4%" width="108%" height="108%"><feTurbulence type="fractalNoise" baseFrequency=".03" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="4.5"/></filter></svg>
<div class="toast" id="toast"></div>
<div id="ce" hidden></div>
<script>/* R3D (porteo a three.js, docs/GUIA_3D_PORTEO.md): Fase 17 (20 oct 2026) = 3D POR DEFECTO. Fase 18 (20 oct 2026): el modo 2D YA NO EXISTE (se retiro); sin WebGL el juego muestra un aviso (game.js, go()). */window.R3D_ON=true;if(window.R3D_ON)window.R3D_READY=new Promise(r=>{window.__r3dOk=r;setTimeout(r,15000)});</script>
