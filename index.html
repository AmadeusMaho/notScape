<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NotScape</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Pixelify+Sans:wght@700&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head><body>
<div id="boot" role="status" aria-live="polite"><div id="bt-box"><div id="bt-logo">NotScape</div><div id="bt-bar"><i id="bt-fill"></i></div><div id="bt-msg">Preparando el mundo…</div></div></div>
<div id="cw"><canvas id="c" width="640" height="400"></canvas><div id="dlg" onclick="dlgNext()"></div></div>
<div id="hud">
<div id="topl"><div id="hd"></div><div class="panel" id="goalp"><h2 onclick="tgGoal()" title="Mostrar / ocultar">🎯 Objetivo</h2><div id="goals"></div></div></div>
<div id="botl"><div id="log"></div><div id="ctl"><button class="bt" id="runb" onclick="tgRun()">🏃 Correr: NO (R)</button><button class="bt" id="autob" onclick="tgAuto()" title="Al matar un enemigo, ir solo al siguiente. Con enemigos agresivos solo lo hace si no arrastra a otros.">🎯 Auto-objetivo: SÍ</button><button class="bt" id="curb" onclick="tgCur()" title="Muestra un rombo en el tile bajo el puntero (tecla G)">▱ Cursor: NO (G)</button><button class="bt" id="qb" onclick="tgQ()" title="Resolución del dibujo. Auto baja sola si el juego va lento">🖼 Calidad</button><label class="sl" title="Volumen de la música">🎵 <input type="range" id="mv" min="0" max="100"></label><label class="sl" title="Volumen de los efectos">🔊 <input type="range" id="sv" min="0" max="100"></label></div></div>
<div id="side" class="closed"><div id="pw"><div id="pn"></div><button class="bt" id="rstb" style="margin-top:10px" onclick="resetGame()">Reiniciar</button></div>
<div id="tabs"><button class="bt" data-t="inv" title="Inventario (I)" onclick="tabClick('inv')"><i class="ic" data-ic="bag"></i><span class="lb">Inv</span></button><button class="bt" data-t="ch" title="Personaje (P)" onclick="tabClick('ch')"><i class="ic" data-ic="person"></i><span class="lb">Personaje</span></button><button class="bt" data-t="sk" title="Skills (K)" onclick="tabClick('sk')"><i class="ic" data-ic="chart"></i><span class="lb">Skills</span></button><button class="bt" data-t="qm" title="Misiones (Q)" onclick="tabClick('qm')"><i class="ic" data-ic="scroll"></i><span class="lb">Misiones</span></button><button class="bt" data-t="q" title="Logros (L)" onclick="tabClick('q')"><i class="ic" data-ic="trophy"></i><span class="lb">Logros</span></button><button class="bt" data-t="col" title="Colección (C)" onclick="tabClick('col')"><i class="ic" data-ic="book"></i><span class="lb">Colección</span></button><button class="bt" data-t="mg" title="Magia (Z)" onclick="tabClick('mg')"><i class="ic" data-ic="star"></i><span class="lb">Magia</span></button><button class="bt" id="gear" title="Ajustes: correr, auto-objetivo, cursor, volumen" onclick="document.body.classList.toggle('ctl')"><i class="ic" data-ic="gear"></i></button></div></div>
</div>
<button id="specb" onclick="specTog()" hidden></button>
<div id="fp" hidden onclick="useNear()"></div>
<div id="sw" hidden><div id="swh"><i id="swi"></i><b id="swt"></b><button class="bt x" title="Cerrar (F / Esc)" onclick="closeIW()">✕</button></div><div id="swf"></div><div id="swb"></div></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="wob" x="-4%" y="-4%" width="108%" height="108%"><feTurbulence type="fractalNoise" baseFrequency=".03" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="4.5"/></filter></svg>
<div class="toast" id="toast"></div>
<div id="ce" hidden></div>
<script src="src/iso.js"></script>
<script src="src/paint.js"></script>
<script src="src/style.js"></script>
<script src="src/style-organic.js"></script>
<script src="src/spots.js"></script>
<script src="src/creatures.js"></script>
<script src="src/ambient.js"></script>
<script src="src/music.js"></script>
<script src="src/water-gl.js"></script>
<script src="src/biomes.js"></script>
<script src="src/biome-spots.js"></script>
<script src="src/layouts.js"></script>
<script src="src/hero.js"></script>
<script src="src/props.js"></script>
<script src="src/interior-art.js"></script>
<script src="src/light.js"></script>
<script src="src/world-iso.js"></script>
<script src="src/ui-paint.js"></script>
<script src="src/combat.js"></script>
<script src="src/interiors.js"></script>
<script src="src/facades.js"></script>
<script src="src/quests.js"></script>
<script src="src/item-icons.js"></script>
<script src="src/village-edit.js"></script>
<script src="src/game.js"></script>
<script src="src/creator.js"></script></body></html>
