<!DOCTYPE html>
<meta charset="utf-8"><title>Naturaleza oscura · hoja de contacto (Fase 4)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#171a1c;--fg:#dcd6cc;--mut:#9a948a;--line:#2e3234;--on:#3b4a3e}

</style>
<header><h1>Naturaleza oscura · Fase 4 (9 biomas)</h1>
<select id="hr" aria-label="Hora"><option value="dia">Día</option><option value="atardecer">Atardecer</option><option value="noche">Noche</option></select>
<button id="bold" aria-pressed="true">Fila «antes» (ORG pastel)</button><button id="baz">↻ Girar cámara</button><button id="bwr" aria-pressed="false">Ver huellas FOOT</button>
</header>
<div id="st"><canvas id="gl"></canvas><div id="lb"></div><div id="err"></div></div>
<!-- ORG (el catálogo 2D) solo se carga para la fila «antes»; el juego NO lo necesita con los props oscuros -->
<script src="../../../src/style.js"></script><script src="../../../src/style-organic.js"></script>
<script type="importmap">{"imports":{"three":"../../../vendor/three/build/three.module.js","three/addons/":"../../../vendor/three/examples/jsm/"}}</script>
<script type="module">
// Hoja de contacto de los props rediseñados en el lenguaje oscuro (Lote R3D-F2C-Q02). Usa el MISMO código y los MISMOS materiales que el juego
// (src/r3d/propsdark3d.js + toon/hull/inkFor de materials3d.js). Fila de arriba = malla actual (ORG), fila de abajo = malla nueva.
// Parámetros: ?hora=dia|atardecer|noche  ?az=<grados> (45 = la del juego)  ?old=0 (sin fila «antes»)  ?rot=1 (todos con o.rot, el espejo x↔z)  ?foot=1 (cajas de FOOT)
//             ?v=0|1|2 (variante de roca/piedra)  ?only=casa,pozo,…  ?cols=8  ?still (congela)
import * as THREE from 'three';
import {toon,hull,inkFor,G,TOD,setInk} from '../../../src/r3d/materials3d.js';
import {natGeo,NAT_FOOT,NAT_PAL,NAT_COUNT,NAT_INST,initNat} from '../../../src/r3d/propsdark_nat3d.js';
import {treeGeo,cardGeo,folMat} from '../../../src/r3d/nature3d.js';
initNat({treeGeo,cardGeo});   // láminas de los árboles para arbustos y pinos enanos
import {orgGeometry} from '../../../tools/r3d/org3d_adapter.mjs';
const ERR=document.getElementById('err');const fail=m=>{ERR.textContent+=m+'\n';window.__err=(window.__err||'')+m+'\n'};addEventListener('error',e=>fail(e.message));addEventListener('unhandledrejection',e=>fail(String(e.reason)));
try{
const Q=new URLSearchParams(location.search),cv=document.getElementById('gl'),lb=document.getElementById('lb'),DPR=Math.min(devicePixelRatio||1,2),still=Q.has('still');
const r=new THREE.WebGLRenderer({canvas:cv,antialias:true,stencil:true});r.setPixelRatio(DPR);r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;r.toneMapping=THREE.NoToneMapping;
const scene=new THREE.Scene(),cam=new THREE.OrthographicCamera(-1,1,1,-1,.1,200);
const hemi=new THREE.HemisphereLight('#fff','#222',1),sun=new THREE.DirectionalLight('#fff',1),back=new THREE.DirectionalLight('#7fa3ad',.5),winL=new THREE.PointLight('#ffb84a',0,6,2);
sun.castShadow=true;sun.shadow.mapSize.set(4096,4096);sun.shadow.bias=-.0008;sun.shadow.normalBias=.02;scene.add(hemi,sun,sun.target,back,back.target);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200).rotateX(-Math.PI/2),new THREE.MeshToonMaterial({color:'#4a5a3a'}));ground.receiveShadow=true;scene.add(ground);
function setHour(h){const D=TOD[h]||TOD.dia,night=h==='noche'?1:h==='atardecer'?.35:0;hemi.color.set(D.hemS);hemi.groundColor.set(D.hemG);hemi.intensity=D.hemI*.9;sun.color.set(D.sun);sun.intensity=D.sunI*.9;
 G.uSat.value=D.sat;G.uLive.value=D.live;G.uNight.value=night;G.uWinI.value=D.win*(night?1:.25);G.uFireI.value=1;G.uRimCol.value.set(D.rim);setInk(D.ink,D.inkK);r.setClearColor(D.sky);ground.material.color.set(night?'#26301f':'#4a5a3a')}
// materiales EXACTOS de props3d.js (Props.constructor)
const mat=toon('#ffffff',{vc:1,moss:.7,emit:1,tex:'auto',texS:7,texB:.45}),ink=inkFor('#6a5a52');
const ALL=[['roca',{}],['piedra',{}],['arbusto',{}],['tocon',{}],['seta',{}],['tronco',{len:26}],['huesos',{}],['charco',{col:'#3f4a2a',water:'#7aa890'}],['carpa',{col:'#8a5a38',trim:'#3a2a22'}]];
const only=Q.get('only')?Q.get('only').split(','):null,BKS=(Q.get('bk')?Q.get('bk').split(',').map(Number):[...Array(NAT_COUNT).keys()]);
const LIST=ALL.filter(([n])=>!only||only.includes(n));
let hour=Q.get('hora')||'dia',az=(Q.has('az')?+Q.get('az'):45)*Math.PI/180,showOld=Q.get('old')!=='0'&&typeof ORG!=='undefined',showFoot=Q.has('foot');const GROUND=['#4a5a3a','#3a4a30','#3c4630','#8e979c','#5a6040','#2c2a2c','#4e4a68','#b09a68','#a89c78'],NM=['Pradera','Bosque','Pantano','Cumbres','Oriental','Volcán','Páramo','Desierto','Costa'];
const SPX=+(Q.get('sp')||2.1),SPZ=+(Q.get('spz')||2.6),items=[],COLS=(showOld?1:0)+BKS.length;
const FAKE=new Proxy({},{get:(t,k)=>k in t?t[k]:(/^create(Linear|Radial)Gradient$/.test(k)?()=>({addColorStop(){}}):k==='measureText'?()=>({width:10}):k==='getImageData'?()=>({data:new Uint8ClampedArray(4)}):k==='canvas'?{width:1,height:1}:()=>{}),set:(t,k,v)=>{t[k]=v;return true}});
function oldGeo(n,o){if(!ORG.U[n])return null;try{const parts=ORG.capture(()=>{ORG.theme(null);ORG.rot(false);try{ORG.U[n](FAKE,0,0,0,o||{})}finally{ORG.theme(null);ORG.rot(false)}});if(!parts.length)return null;const g=orgGeometry(THREE,parts,{seed:n.length});g.computeBoundingBox();return g}catch(e){fail('ORG '+n+': '+e.message);return null}}
function mesh(g,cards){const m=new THREE.Mesh(g,mat);m.castShadow=m.receiveShadow=true;const h=new THREE.Mesh(hull(g,.022).geometry,ink);const grp=new THREE.Group();grp.add(m,h);if(cards){const f=new THREE.Mesh(cards.g,folMat(cards.tex));f.castShadow=true;grp.add(f)}return grp}
const BAD=[];function check(n,bk,g,cards){const b=new THREE.Box3().setFromBufferAttribute(g.attributes.position);if(cards)b.union(new THREE.Box3().setFromBufferAttribute(cards.g.attributes.position));const F=NAT_FOOT[n];if(!F)return;const sz=b.getSize(new THREE.Vector3()),r=[sz.x/F[0],sz.y/F[1],sz.z/F[2]],dev=Math.max(...r.map(v=>Math.abs(v-1)));if(n!=='tronco'&&dev>.22)BAD.push(n+' bk'+bk+' '+r.map(v=>v.toFixed(2)).join('/'))}
const disc=(c)=>{const m=new THREE.Mesh(new THREE.CircleGeometry(1.0,28).rotateX(-Math.PI/2),new THREE.MeshToonMaterial({color:c}));m.position.y=.003;m.receiveShadow=true;return m};
LIST.forEach(([n,o],gr)=>{
 const put=(g,col,isOld,bk,cards)=>{const grp=mesh(g,cards);if(!isOld)check(n,bk,g,cards);grp.add(disc(GROUND[isOld?0:bk]));const u=(col-(COLS-1)/2)*SPX,v=(LIST.length-1-gr)*SPZ;grp.userData={u,v,n,isOld,o};
  if(Q.has('inst')&&!isOld){const k=NAT_INST[n]||[0,1,1,0];grp.scale.setScalar(1.0);grp.rotation.y=k[0]?(col*1.7+gr):0}   // ?inst=1 : giro de ejemplo
  scene.add(grp);items.push(grp);const s=document.createElement('span');s.textContent=(isOld?'ANTES · ':NM[bk]+' · ')+n;lb.appendChild(s);grp.userData.lab=s;
  if(!isOld&&showFoot&&NAT_FOOT[n]){const f=NAT_FOOT[n],bx=new THREE.Mesh(new THREE.BoxGeometry(f[0],f[1],f[2]),new THREE.MeshBasicMaterial({color:'#7ad0ff',wireframe:true}));bx.position.y=f[1]/2;grp.add(bx)}};
 let col=0;if(showOld){const g=oldGeo(n,o);if(g)put(g,0,true,0);col=1}   // algunos modelos viejos (tronco, huesos, charco, carpa) viven en game.js y no tienen fila «antes»
 BKS.forEach((bk,i)=>{const G=natGeo(n,{...o,bk,v:+(Q.get('v')||0)});if(!G){fail('sin malla '+n);return}put(G.g,col+i,false,bk,G.cards)})});
function place(){const right=new THREE.Vector3(Math.cos(az),0,-Math.sin(az)),bk=new THREE.Vector3(-Math.sin(az),0,-Math.cos(az));items.forEach(g=>{g.position.copy(right).multiplyScalar(g.userData.u).addScaledVector(bk,g.userData.v)})}
const EL=Math.PI/6;
function layout(){const W=cv.clientWidth,H=cv.clientHeight;r.setSize(W,H,false);const asp=W/H;place();
 cam.position.set(Math.sin(az)*Math.cos(EL)*60,Math.sin(EL)*60,Math.cos(az)*Math.cos(EL)*60);cam.lookAt(0,0,0);cam.updateMatrixWorld();
 const inv=cam.matrixWorldInverse.copy(cam.matrixWorld).invert();let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;items.forEach(g=>{[0,1.6].forEach(h=>{const v=new THREE.Vector3(g.position.x,h,g.position.z).applyMatrix4(inv);x0=Math.min(x0,v.x-1.1);x1=Math.max(x1,v.x+1.1);y0=Math.min(y0,v.y-.9);y1=Math.max(y1,v.y+.3)})});
 const cx=(x0+x1)/2,cy=(y0+y1)/2;let hw=(x1-x0)/2,hh=(y1-y0)/2;if(hw/hh<asp)hw=hh*asp;else hh=hw/asp;cam.left=cx-hw;cam.right=cx+hw;cam.top=cy+hh;cam.bottom=cy-hh;cam.updateProjectionMatrix();
 sun.position.set(-6,12,4).normalize().multiplyScalar(40);sun.target.position.set(0,0,0);const e=Math.max(hw,hh)*1.5;Object.assign(sun.shadow.camera,{left:-e,right:e,top:e,bottom:-e,near:1,far:120});sun.shadow.camera.updateProjectionMatrix();back.position.set(8,6,-8);window.__layout={cx,cy,hw,hh}}
const bold=document.getElementById('bold'),hr=document.getElementById('hr');hr.value=hour;hr.onchange=()=>{const u=new URL(location);u.searchParams.set('hora',hr.value);location=u};
bold.onclick=()=>{const u=new URL(location);u.searchParams.set('old',showOld?'0':'1');location=u};bold.setAttribute('aria-pressed',showOld);
document.getElementById('baz').onclick=()=>{az+=Math.PI/4;layout()};const bwr=document.getElementById('bwr');bwr.setAttribute('aria-pressed',showFoot);bwr.onclick=()=>{showFoot=!showFoot;bwr.setAttribute('aria-pressed',showFoot)};
setHour(hour);
function frame(now){G.uTime.value=still?1.2:now/1000;items.forEach(g=>{if(g.userData.foot)g.userData.foot.visible=showFoot});scene.updateMatrixWorld(true);
 const W=cv.clientWidth,H=cv.clientHeight;items.forEach(g=>{const v=new THREE.Vector3(g.position.x,-.12,g.position.z).project(cam);const s=g.userData.lab;s.style.left=((v.x+1)/2*W)+'px';s.style.top=((1-v.y)/2*H)+'px'});
 r.render(scene,cam);window.__done=(window.__done||0)+1;if(!still)requestAnimationFrame(frame)}
layout();addEventListener('resize',layout);requestAnimationFrame(frame);if(still)setTimeout(()=>requestAnimationFrame(frame),300);
window.__sheet={bad:BAD,n:items.length,tris:items.filter(g=>!g.userData.isOld).reduce((a,g)=>a+g.children[0].geometry.attributes.position.count/3,0)};
}catch(e){document.getElementById('err').textContent=String(e&&e.stack||e);window.__err=String(e)}
</script>
