<style>
:root{--bg:#0f0d14;--fg:#d8cfe0;--mut:#a497b4;--line:#2c2538;--pill:rgba(18,14,26,.74);--on:#3a2d52;--acc:#ffb35a;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,sans-serif}
body{box-sizing:border-box;display:flex;flex-direction:column;gap:6px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--pill)}
.seg button{all:unset;cursor:pointer;padding:5px 12px;font-size:13px;color:var(--mut)}
.seg button[aria-pressed="true"]{background:var(--on);color:var(--fg)}
.seg button:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
#st{position:relative;flex:1;min-height:320px;border:2px solid var(--line);border-radius:16px;overflow:hidden;background:#14111b}
#st canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
#st canvas:active{cursor:grabbing}
#stats{position:absolute;right:10px;bottom:8px;font:11px ui-monospace,monospace;color:var(--mut);background:var(--pill);padding:3px 8px;border-radius:8px;pointer-events:none}
#err{position:absolute;inset:auto 12px 40% 12px;color:#ffb3b3;font:12px ui-monospace,monospace;white-space:pre-wrap}
