<style>
:root{--bg:#141210;--pan:rgba(24,20,17,.86);--ink:#e8dcc0;--dim:#a89878;--acc:#d8a24a;--edge:#4a3c2c}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.35 system-ui,sans-serif;overflow:hidden}

.g{margin:8px 0}.g>b{display:block;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.row{display:flex;flex-wrap:wrap;gap:4px}

#labels div i{display:block;font-style:normal;font-size:11px;color:#c8b48a}
#load{position:fixed;inset:0;display:grid;place-items:center;color:var(--dim);font-size:16px;pointer-events:none}
</style></head><body>
<canvas id="c"></canvas><div id="labels"></div><div id="load">Generando figuras…</div>
<script>if(location.protocol==='file:')document.getElementById('load').innerHTML='<div style="text-align:center;max-width:460px">Necesita un servidor local: ejecuta VER_DEMO.bat (Windows) o ver_demo.command (Mac).</div>'</script>
<div id="ui"><h1 id="tg">Figuras diorama</h1>
 <div class="g"><b>Hora</b><div class="row" id="hora"></div></div>
 <div class="g"><b>Óleo <span id="ovv"></span></b><input type="range" id="ov" min="0" max="100"></div>

 <div class="note">Arrastra para girar · rueda para acercar.</div></div>

<script type="module">

{const g=new THREE.CircleGeometry(40,96).rotateX(-Math.PI/2),c=[],p=g.attributes.position,A=new THREE.Color('#4a6230'),B=new THREE.Color('#6a5038'),C=new THREE.Color();
 for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i),d=Math.hypot(x,z+.3),k=Math.max(0,Math.min(1,(2.2-d)/1.4+(hash(x,z,3)-.5)*.5));C.copy(A).lerp(B,k).multiplyScalar(.9+hash(x*3,z*3,1)*.2);c.push(C.r,C.g,C.b)}

{for(let i=0;i<6;i++){const l=new THREE.Mesh(new THREE.CylinderGeometry(.05,.06,.7,5).rotateZ(Math.PI/2),toon('#4a3020',{flat:1}));l.rotation.y=i/6*Math.PI;l.position.y=.05;fire.add(l)}
 const fl=new THREE.Mesh(new THREE.ConeGeometry(.22,.6,6),new THREE.MeshBasicMaterial({color:new THREE.Color('#ff9a40').multiplyScalar(2.4)}));fl.position.y=.35;fire.add(fl);fire.userData.fl=fl}

 fragmentShader:`uniform sampler2D tDiffuse;uniform vec2 uRes;uniform float uVig,uK,uBrush;uniform vec3 uLift;varying vec2 vUv;
  ${OIL_GLSL}
  vec3 kuw(vec2 uv,float s){vec2 px=s/uRes;vec3 bm=vec3(0.);float bv=1e9;
   for(int q=0;q<4;q++){vec2 sg=vec2(q==0||q==2?-1.:1.,q<2?-1.:1.);vec3 m=vec3(0.);float l2=0.;
    for(int i=0;i<3;i++)for(int j=0;j<3;j++){vec3 c=texture2D(tDiffuse,uv+px*sg*vec2(float(i),float(j))).rgb;m+=c;float l=olum(c);l2+=l*l;}
    m/=9.;float l=olum(m);float v=l2/9.-l*l;if(v<bv){bv=v;bm=m;}}

  void main(){float sc=max(1.,uRes.y/620.);vec3 c=texture2D(tDiffuse,vUv).rgb;if(uBrush>.01)c=mix(c,kuw(vUv,sc),uBrush);

composer.addPass(grade);composer.addPass(new OutputPass());
let hour=Q.get('t')||'atardecer',az=Math.PI/4,zoomH=Q.get('zoom')==='juego'?0:(+Q.get('z')||3.2),inkOn=!Q.has('noink'),spin=false;
setOil(Q.has('oil')?+Q.get('oil')/100:OIL.K);

const figs=list.map(s=>new Mini(s));figs.forEach(f=>{scene.add(f.obj);f.setInk(inkOn)});
const right=()=>new THREE.Vector3(Math.cos(az),0,-Math.sin(az));
const slot=i=>{const row=N>5?(i<Math.ceil(N/2)?0:1):0,n=N>5?Math.ceil(N/2):N,k=N>5?(row?i-n:i):i,m=N>5?(row?N-n:n):N;

document.getElementById('load').remove();
function btns(id,L,cur,fn){const el=document.getElementById(id);el.innerHTML='';L.forEach(([v,l])=>{const b=document.createElement('button');b.textContent=l;if(String(v)===String(cur))b.className='on';b.onclick=()=>fn(v);el.appendChild(b)})}
const HS=[['noche','Noche'],['atardecer','Atardecer'],['dia','Día']],ZS=[[3.2,'Grupo'],[1.5,'Cerca'],[0,'Tamaño de juego']];
const bh=v=>{hour=v;btns('hora',HS,hour,bh)},bz=v=>{zoomH=+v;btns('zoom',ZS,zoomH,bz)};bh(hour);bz(zoomH);
const ov=document.getElementById('ov'),ovv=document.getElementById('ovv');ov.value=Math.round(OIL.K*100);ovv.textContent=ov.value+' %';ov.oninput=()=>{setOil(ov.value/100);ovv.textContent=ov.value+' %'};
document.getElementById('ink').checked=inkOn;document.getElementById('ink').onchange=e=>{inkOn=e.target.checked;figs.forEach(f=>f.setInk(inkOn))};
document.getElementById('spin').onchange=e=>spin=e.target.checked;document.getElementById('tg').onclick=()=>document.getElementById('ui').classList.toggle('min');
let drag=null;cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,a:az};cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointermove',e=>{if(drag){az=drag.a-(e.clientX-drag.x)*.008;place()}});
cv.addEventListener('pointerup',()=>drag=null);cv.addEventListener('wheel',e=>{e.preventDefault();zoomH=Math.max(.8,Math.min(5,(zoomH||1.9)*(e.deltaY>0?1.1:.9)))},{passive:false});
const LB=document.getElementById('labels');
function labels(W,H){if(LB.childElementCount!==N){LB.innerHTML='';for(let i=0;i<N;i++)LB.appendChild(document.createElement('div'))}
 figs.forEach((f,i)=>{const v=f.obj.position.clone();v.y=-.08;v.project(cam);const d=LB.children[i];d.style.left=((v.x+1)/2*W)+'px';d.style.top=((1-v.y)/2*H)+'px';d.innerHTML=`${f.spec.name}<i>${f.spec.role}</i>`;d.style.display=zoomH===0?'none':''})}
let last=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.1,(now-last)/1000);last=now;const t=STILL?2.3:now/1000;G.uTime.value=t;if(spin&&!STILL){az+=dt*.5;place()}
 const W=innerWidth,H=innerHeight,pr=r.getPixelRatio();if(cv.width!==Math.round(W*pr)||cv.height!==Math.round(H*pr)){r.setSize(W,H,false);composer.setPixelRatio(pr);composer.setSize(W,H);bloom.resolution.set(W/2,H/2)}
 grade.uniforms.uRes.value.set(W*pr,H*pr);
 const p=TOD[hour];hemi.color.set(p.hemS);hemi.groundColor.set(p.hemG);hemi.intensity=p.hemI;sun.color.set(p.sun);sun.intensity=p.sunI;sun.position.set(...p.sunP).normalize().multiplyScalar(20);
 G.uSat.value=p.sat;G.uLive.value=p.live;G.uNight.value=p.night;G.uRimCol.value.set(p.rim);setInk(p.ink,p.inkK);r.setClearColor(p.sky);
 back.position.set(-Math.sin(az)*8,5,-Math.cos(az)*8);back.intensity=.8-.4*p.night;
 const fp=new THREE.Vector3(-Math.sin(az),0,-Math.cos(az)).multiplyScalar(N>5?4.8:3.4);fire.position.copy(fp);fireL.position.copy(fp).setY(.6);
 const fl=1+Math.sin(t*11)*.12+Math.sin(t*5)*.08;fireL.intensity=4.5*p.fire*fl;fire.userData.fl.scale.set(1,fl,1);G.uChrB.value.set(0,HT);
 bloom.strength=p.bloom;grade.uniforms.uLift.value.set(p.lift);grade.uniforms.uVig.value=p.vig;grade.uniforms.uK.value=OIL.K;grade.uniforms.uBrush.value=.85*Math.pow(OIL.K,1.6);

 cam.left=-hh*asp;cam.right=hh*asp;cam.top=hh;cam.bottom=-hh;cam.updateProjectionMatrix();const EL=Math.PI/6;cam.position.set(tg.x+Math.sin(az)*Math.cos(EL)*30,tg.y+Math.sin(EL)*30,tg.z+Math.cos(az)*Math.cos(EL)*30);cam.lookAt(tg);
