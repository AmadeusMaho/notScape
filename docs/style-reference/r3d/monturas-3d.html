<script type="module">
// Visor de MONTURAS (lote DOMAR-D3-MODELOS): mismas funciones que el juego (src/r3d/mountmodels3d.js + mount3d.js).
// ?ids=caballo,poni,…|bio=0..9  ?sad=1|0 (con/sin silla)  ?gait=0|1|2 (quieto/trote/galope)  ?az=<grados>  ?still&t=1.2  ?cols=4  ?sp=2.6 (separación)
import * as THREE from 'three';
import {Mount3D} from '../../../src/r3d/mount3d.js';
import {MSPEC,MBIO} from '../../../src/r3d/mountmodels3d.js';
import {G,TODH,setInk} from '../../../src/r3d/materials3d.js';
const ERR=document.getElementById('err');const fail=m=>{ERR.textContent+=m+'\n';window.__err=(window.__err||'')+m+'\n'};addEventListener('error',e=>fail(e.message));addEventListener('unhandledrejection',e=>fail(String(e.reason)));
try{
const Q=new URLSearchParams(location.search),cv=document.getElementById('gl'),lb=document.getElementById('lb'),still=Q.has('still');
const r=new THREE.WebGLRenderer({canvas:cv,antialias:true,preserveDrawingBuffer:true});r.setPixelRatio(Math.min(devicePixelRatio||1,2));r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;r.toneMapping=THREE.NoToneMapping;
const scene=new THREE.Scene(),cam=new THREE.OrthographicCamera(-1,1,1,-1,.1,100);
const D=TODH.dia,hemi=new THREE.HemisphereLight(D.hemS,D.hemG,D.hemI*.8),sun=new THREE.DirectionalLight(D.sun,D.sunI*.8),back=new THREE.DirectionalLight('#7fa3ad',.6);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-.0008;sun.shadow.normalBias=.02;scene.add(hemi,sun,sun.target,back,back.target);
G.uSat.value=D.sat;G.uLive.value=D.live;G.uNight.value=0;G.uRimCol.value.set(D.rim);setInk(D.ink,D.inkK);r.setClearColor('#3a4332');
const ground=new THREE.Mesh(new THREE.PlaneGeometry(120,120).rotateX(-Math.PI/2),new THREE.MeshToonMaterial({color:'#5a6a44'}));ground.receiveShadow=true;scene.add(ground);
const bio=Q.get('bio');const pick=Q.get('ids')?Q.get('ids').split(','):Object.keys(MSPEC).filter(k=>bio==null||MBIO[k]==+bio);
const sad=Q.get('sad')!=='0',gait=+(Q.get('gait')||0),az=(Q.has('az')?+Q.get('az'):45)*Math.PI/180,T=+(Q.get('t')||1.2),EL=Math.PI/6;
const FACE=az-(Q.has('yaw')?+Q.get('yaw'):70)*Math.PI/180;const cols=+(Q.get('cols')||Math.min(6,Math.ceil(Math.sqrt(pick.length*1.3)))),SP=+(Q.get('sp')||2.6),rows=Math.ceil(pick.length/cols),ms=[];
pick.forEach((id,i)=>{const M=new Mount3D(id,undefined,sad);M.obj.traverse(o=>{if(o.isMesh)o.castShadow=true});const c=i%cols,rw=Math.floor(i/cols);const u=(c-(cols-1)/2)*SP,v=(rw-(rows-1)/2)*SP*.85;M.home=new THREE.Vector3(Math.cos(az)*u-Math.sin(az)*v,0,-Math.sin(az)*u-Math.cos(az)*v);scene.add(M.obj);M.id=id;ms.push(M);
 const s=document.createElement('span');s.textContent=id;lb.appendChild(s);M.lab=s});
function layout(){const W=cv.clientWidth,H=cv.clientHeight;r.setSize(W,H,false);const asp=W/H;
 cam.position.set(Math.sin(az)*Math.cos(EL)*40,Math.sin(EL)*40+.8,Math.cos(az)*Math.cos(EL)*40);cam.lookAt(0,.8,0);cam.updateMatrixWorld();
 const inv=cam.matrixWorldInverse.copy(cam.matrixWorld).invert();let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;ms.forEach(M=>{[0,2].forEach(h=>{const v=new THREE.Vector3(M.home.x,h,M.home.z).applyMatrix4(inv);x0=Math.min(x0,v.x-1.1);x1=Math.max(x1,v.x+1.1);y0=Math.min(y0,v.y-.6);y1=Math.max(y1,v.y+.3)})});
 const cx=(x0+x1)/2,cy=(y0+y1)/2;let hw=(x1-x0)/2,hh=(y1-y0)/2;if(hw/hh<asp)hw=hh*asp;else hh=hw/asp;cam.left=cx-hw;cam.right=cx+hw;cam.top=cy+hh;cam.bottom=cy-hh;cam.updateProjectionMatrix();
 sun.position.set(-6,12,4).normalize().multiplyScalar(30);const e=Math.max(hw,hh)*1.4;Object.assign(sun.shadow.camera,{left:-e,right:e,top:e,bottom:-e,near:1,far:80});sun.shadow.camera.updateProjectionMatrix();back.position.set(-Math.sin(az)*6,4,-Math.cos(az)*6)}
let last=performance.now(),t0=0;
function step(t,dt){const sp=gait===2?4.2:gait===1?2.4:0;ms.forEach(M=>{M.update(1,gait,sp*dt,dt,t,M.home,FACE)})}
function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;t0+=dt;let t=t0;
 if(still){t=T;ms.forEach(M=>{M.ph=0;M.gait=gait;M.wf=gait===2?1:0});for(let i=0;i<Math.round(T*60);i++)step(i/60,1/60)}else step(t,dt);G.uTime.value=t;scene.updateMatrixWorld(true);
 const W=cv.clientWidth,H=cv.clientHeight;ms.forEach(M=>{const v=new THREE.Vector3(M.home.x,-.3,M.home.z).project(cam);M.lab.style.left=((v.x+1)/2*W)+'px';M.lab.style.top=((1-v.y)/2*H)+'px'});
 r.render(scene,cam);window.__done=(window.__done||0)+1;if(!still)requestAnimationFrame(frame)}
layout();addEventListener('resize',layout);requestAnimationFrame(frame);
}catch(e){document.getElementById('err').textContent=String(e&&e.stack||e);window.__err=String(e)}
</script>
